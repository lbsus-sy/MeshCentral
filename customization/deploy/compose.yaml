name: meshcentral-custom

services:
  meshcentral:
    image: ${MESH_IMAGE:-meshcentral-custom:local}
    build:
      context: ../..
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      TZ: ${TZ:-Asia/Singapore}
      # This fork's Compose environment is the source of truth for managed config keys.
      DYNAMIC_CONFIG: "true"
      HOSTNAME: ${MESH_HOSTNAME:?Set MESH_HOSTNAME in customization/deploy/.env}
      PORT: "443"
      REDIR_PORT: "80"
      ALLOW_NEW_ACCOUNTS: "${MESH_ALLOW_NEW_ACCOUNTS:-false}"
      TLS_OFFLOAD: "${MESH_TLS_OFFLOAD:-false}"
      TRUSTED_PROXY: "${MESH_TRUSTED_PROXY:-}"
      ALLOW_PLUGINS: "false"
      REGEN_SESSIONKEY: "false"
      WEBRTC: "false"
    ports:
      - "${MESH_HTTPS_PORT:-443}:443"
      - "${MESH_HTTP_PORT:-80}:80"
    volumes:
      - meshcentral-data:/opt/meshcentral/meshcentral-data
      - meshcentral-files:/opt/meshcentral/meshcentral-files
      - ../branding/web:/opt/meshcentral/meshcentral-web:ro
      - meshcentral-backups:/opt/meshcentral/meshcentral-backups
    healthcheck:
      test: ["CMD-SHELL", "if [ \"$$TLS_OFFLOAD\" = \"false\" ] || [ -z \"$$TLS_OFFLOAD\" ]; then curl -k --fail https://localhost:443/health.ashx; else curl --fail http://localhost:443/health.ashx; fi"]
      interval: 30s
      timeout: 8s
      start_period: 30s
      retries: 3
    stop_grace_period: 45s
    security_opt:
      - no-new-privileges:true

volumes:
  meshcentral-data:
  meshcentral-files:
  meshcentral-backups:
